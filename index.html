<title>İngilizce Kartlar</title>

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kartlar">

<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --border: #d9dde3;
    --accent: #2563eb;
    --correct: #16a34a;
    --correct-bg: #dcfce7;
    --wrong: #dc2626;
    --wrong-bg: #fee2e2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  #app { width: 100%; max-width: 440px; }

  .word-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 4px 0 24px; }
  .word-row .word { margin: 0; }
  .speak-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 18px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .listen-btn { margin: 4px 0 24px; font-size: 20px; padding: 18px; }
  .sentence-row { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; }
  .sentence-text { flex: 1; font-size: 20px; font-weight: 600; line-height: 1.4; text-align: center; }
  .question { text-align: center; color: var(--muted); margin: 0 0 20px; }
  .fill-sentence { font-size: 20px; font-weight: 600; line-height: 1.6; text-align: center; margin: 4px 0 22px; }
  .blank { display: inline-block; min-width: 72px; border-bottom: 2px solid var(--text); }
  .reveal { text-align: center; font-weight: 700; margin-top: 6px; }
  .banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: var(--correct-bg);
    border: 1px solid var(--correct);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-weight: 600;
  }

  .top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .greeting { font-size: 20px; font-weight: 700; margin: 0; word-break: break-word; }
  .link-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .progress-list { list-style: none; padding: 0; margin: 0 0 8px; }
  .progress-list li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .progress-list li:last-child { border-bottom: none; }
  .progress-list .value { font-weight: 700; text-align: right; }
  .name-note { color: var(--muted); font-size: 13px; text-align: center; margin-top: 12px; }

  .level-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 14px;
    color: var(--muted);
  }
  .level-bar strong { color: var(--text); font-size: 16px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 4px;
    text-align: center;
  }
  .stat-value { font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat-value.correct { color: var(--correct); }
  .stat-value.wrong { color: var(--wrong); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 20px;
  }
  .word {
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1px;
    margin: 4px 0 24px;
    word-break: break-word;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    width: 100%;
    text-align: left;
    font-size: 17px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  /* Şıklarda hiçbir vurgu yok: dokunmatik ekranda takılı kalan "üzerine gelme"
     ve dokunma/odak efektleri bir şıkkı işaretlenmiş gibi gösterip yanıltıyordu. */
  .option { -webkit-tap-highlight-color: transparent; }
  .option:focus { outline: none; }
  .option:disabled { cursor: default; }
  .option .letter { font-weight: 700; margin-right: 8px; }
  .option.correct { border-color: var(--correct); background: var(--correct-bg); }
  .option.wrong { border-color: var(--wrong); background: var(--wrong-bg); }

  .write-form { display: flex; flex-direction: column; gap: 10px; }
  .write-input {
    width: 100%;
    font-size: 17px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  .write-input:focus { outline: none; border-color: var(--accent); }
  .write-input.correct { border-color: var(--correct); background: var(--correct-bg); }
  .write-input.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
  .write-hint { text-align: center; color: var(--muted); font-size: 14px; margin: -12px 0 16px; }

  .feedback { margin-top: 16px; font-weight: 600; text-align: center; min-height: 1.4em; }
  .feedback.correct { color: var(--correct); }
  .feedback.wrong { color: var(--wrong); }

  .primary {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .remaining { text-align: center; color: var(--muted); font-size: 13px; margin-top: 12px; }
  .summary { text-align: center; line-height: 1.6; }
  .summary h2 { margin: 0 0 8px; font-size: 22px; }
  .summary p { margin: 6px 0; }
  .reset {
    display: block;
    margin: 20px auto 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }
</style>
</head>

function shuffle(list) {
  const copy = list.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function save(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}
function clearSaved() {
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
}

// Cihazın kendi ses motoru (Web Speech API) — internet servisi yok.
// İngilizce ses yoksa ya da tarayıcı desteklemiyorsa status "no" olur ve hiçbir şey seslendirilmez.
const Speech = {
  status: "pending", // "pending" | "yes" | "no"
  voice: null,
  listeners: [],
  init() {
    if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
      this.status = "no";
      return;
    }
    const pick = () => {
      let voices = [];
      try { voices = window.speechSynthesis.getVoices() || []; } catch {}
      // Yalnızca cihazın kendi sesleri: localService=false olan sesler (ör. Chrome'un "Google ..." sesleri)
      // metni internetteki bir sunucuya gönderir, kullanılmaz.
      const english = voices.filter(v => /^en([-_]|$)/i.test(v.lang || "") && v.localService !== false);
      const voice = english.find(v => /^en[-_]US/i.test(v.lang)) || english[0] || null;
      if (voice) { this.voice = voice; this.setStatus("yes"); }
      return !!voice;
    };
    if (pick()) return;
    try { window.speechSynthesis.addEventListener("voiceschanged", pick); }
    catch { window.speechSynthesis.onvoiceschanged = pick; }
    setTimeout(() => { if (!pick()) this.setStatus("no"); }, 2000);
  },
  setStatus(status) {
    if (this.status === status) return;
    this.status = status;
    this.listeners.forEach(fn => fn());
  },
  onChange(fn) { this.listeners.push(fn); },
  speak(text) {
    if (this.status !== "yes") return;
    try {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.voice = this.voice;
      utterance.lang = this.voice.lang;
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    } catch {}
  },
};

/* =========================================================================
   4) AŞAMA 1 — İsim, seviye testi ve günlük çalışma
   Akış:
     (0) İlk açılışta isim sorulur (yalnızca cihazda saklanır).
     (1) Yeni kullanıcıya bir kez seviye testi: A1 + A2'den karışık, 4 şıklı.
         Toplam doğru sayısına göre A1 ya da A2'den başlanır.
     (2) Her gün (cihaz saatine göre) 10 kelime:
           a) seçmeli sorular (4 şık) — ilk denemede doğru bilinen kelime "bilinen" sayılır
           b) yanlış cevaplananlar şıksız, Türkçesi yazılarak tekrar edilir
           c) dinleme: kelime yalnızca sesli okunur, 4 Türkçe şık (İngilizce ses yoksa atlanır)
           d) boşluk doldurma: örnek cümlede kelimenin yeri boş, doğru yazılana kadar
           e) anlama: örnek cümle yazılı + sesli, "ne anlatıyor?" 4 Türkçe şık
         Aynı gün tekrar girilirse aynı kelimelerle kaldığı yerden devam edilir.
     (3) Kilitli seviye (B1): önceki seviyelerin kelimelerinin %90'ı bilinince açılır.
         Önceki seviyeler bitip oran %90'ın altındaysa günler bilinmeyen kelimelerle tekrar günü olur.
     (4) İlerleme ekranı: seri, son 30 günde görülen kelime, seviyelerin açık/kilitli durumu.
   Her aşama kendi içinde bağımsız: mount(container) ile ekrana çizilir.
   ========================================================================= */

// Büyük/küçük harf, fazla boşluk ve Türkçe harf farkı önemsenmez.
function normalizeAnswer(text) {
  const fold = { "ı": "i", "ş": "s", "ç": "c", "ğ": "g", "ö": "o", "ü": "u", "â": "a", "î": "i", "û": "u" };
  return text
    .toLocaleLowerCase("tr")
    .replace(/[ışçğöüâîû]/g, ch => fold[ch])
    .replace(/\s+/g, " ")
    .trim();
}

// Cihaz saatine göre yerel tarih: "YYYY-MM-DD".
function localDateStr(date = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
}
function shiftDate(dateStr, days) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return localDateStr(new Date(y, m - 1, d + days));
}

// Örnek cümlede kelimenin yerini boş bırakır: "This apple is sweet." → ["This ", " is sweet."]
function splitAtWord(sentence, word) {
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const match = new RegExp("\\b" + escaped + "\\b", "i").exec(sentence);
  if (!match) return [sentence + " ", ""];
  return [sentence.slice(0, match.index), sentence.slice(match.index + match[0].length)];
}

// Boşluk doldurma kontrolü: yalnızca büyük/küçük harf ve baştaki/sondaki boşluk önemsenmez.
function fillAnswerIsCorrect(typed, word) {
  return typed.trim().toLowerCase() === word.toLowerCase();
}

const OPTION_LETTERS = "ABCDEFGH";
const PHASE_LABELS = {
  choice: "Seçmeli", write: "Yazma", listen: "Dinleme", fill: "Boşluk doldurma",
  understand: "Anlama", done: "Tamamlandı",
};

const Stage1 = {
  mount(container) {
    let state = migrate(loadSaved()) || freshState();
    let view = "study"; // "study" | "progress" — kaydedilmez, her açılışta çalışma ekranı

    function freshState() {
      return {
        name: null,
        needsPlacement: true,
        placement: null,
        levelIndex: 0,
        seen: {},      // seviye id → günlük olarak verilmiş kelimeler (en)
        known: {},     // seviye id → seçmeli soruda ilk denemede doğru bilinen kelimeler (en)
        unlocked: {},  // seviye id → kilitli seviye açıldı mı
        unlockNotice: null,
        visits: [],    // uygulamanın açıldığı günler (seri için)
        history: [],   // { date, lvl, words } — son günlerde görülen kelimeler
        dayCount: 0,
        day: null,     // bugünün oturumu
      };
    }

    // Önceki sürümlerin kaydını bu sürüme taşır; isim, gün sayısı, seri ve görülen kelimeler korunur.
    function migrate(saved) {
      if (!saved) return null;
      if (!saved.seen) {
        // günlük sistemden önceki sürüm: yalnızca isim ve seviye korunur
        const s = freshState();
        s.name = saved.name || null;
        s.needsPlacement = !!saved.needsPlacement;
        s.levelIndex = saved.levelIndex || 0;
        if (s.name && s.needsPlacement) s.placement = newPlacement();
        return s;
      }
      saved.known = saved.known || {};
      saved.unlocked = saved.unlocked || {};
      if (saved.unlockNotice === undefined) saved.unlockNotice = null;
      // yarım kalmış cevap kaydı eski sürümde "en" alanıyla tutuluyordu
      [saved.placement, saved.day && saved.day.round].forEach(holder => {
        if (holder && holder.lastAnswer && !holder.lastAnswer.key) holder.lastAnswer.key = holder.lastAnswer.en;
      });
      if (saved.day && saved.day.phase === "sentence") {
        // serbest cümle adımı kaldırıldı: kalan kelimeler boşluk doldurma olarak devam eder
        saved.day.phase = "fill";
        saved.day.fillIndex = saved.day.sentenceIndex || 0;
      }
      return saved;
    }

    function newRound(deck) {
      return { deck, index: 0, answered: 0, correct: 0, wrong: 0, lastAnswer: null, shown: null };
    }

    function newPlacement() {
      const deck = [];
      PLACEMENT_COUNTS.forEach((count, lvlIndex) => {
        shuffle(LEVELS[lvlIndex].words).slice(0, count).forEach(w => deck.push({ lvl: lvlIndex, en: w.en }));
      });
      return newRound(shuffle(deck));
    }

    const levelId = i => LEVELS[i].id;
    function unseenWords(i) {
      const seen = new Set(state.seen[levelId(i)] || []);
      return LEVELS[i].words.filter(w => !seen.has(w.en));
    }
    function unknownWords(i) {
      const known = new Set(state.known[levelId(i)] || []);
      return LEVELS[i].words.filter(w => !known.has(w.en));
    }
    function knownCount(i) { return (state.known[levelId(i)] || []).length; }
    function isUnlocked(i) { return !LEVELS[i].locked || !!state.unlocked[levelId(i)]; }

    // Kilitli bir seviyenin açılma oranı: kendinden önceki seviyelerde bilinen kelime yüzdesi.
    function unlockPercent(i) {
      const before = LEVELS.slice(0, i);
      const total = before.reduce((sum, lvl) => sum + lvl.words.length, 0);
      const known = before.reduce((sum, _, j) => sum + knownCount(j), 0);
      return total === 0 ? 100 : Math.floor((known / total) * 100);
    }
    function checkUnlocks() {
      LEVELS.forEach((lvl, i) => {
        if (lvl.locked && !isUnlocked(i) && unlockPercent(i) >= UNLOCK_PERCENT) {
          state.unlocked[lvl.id] = true;
          state.unlockNotice = lvl.id;
        }
      });
    }
    function markKnown(i, en) {
      const id = levelId(i);
      state.known[id] = state.known[id] || [];
      if (!state.known[id].includes(en)) state.known[id].push(en);
      checkUnlocks();
    }

    // Yeni günün kelimeleri: önce açılmış kilitli seviye, sonra sıradaki seviye,
    // kilit bekleniyorsa bilinmeyen kelimelerle tekrar günü.
    function pickDay() {
      const take = words => shuffle(words).slice(0, DAILY_WORD_COUNT).map(w => w.en);
      for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (LEVELS[i].locked && isUnlocked(i) && unseenWords(i).length) return { lvl: i, review: false, words: take(unseenWords(i)) };
      }
      for (let i = state.levelIndex; i < LEVELS.length; i++) {
        if (!LEVELS[i].locked && unseenWords(i).length) return { lvl: i, review: false, words: take(unseenWords(i)) };
      }
      const waitingForUnlock = LEVELS.some((lvl, i) => lvl.locked && !isUnlocked(i));
      if (waitingForUnlock) {
        for (let i = 0; i < LEVELS.length; i++) {
          if (!LEVELS[i].locked && unknownWords(i).length) return { lvl: i, review: true, words: take(unknownWords(i)) };
        }
      }
      return null;
    }

    // Bugünün kaydını hazırlar: girişi seriye ekler, yeni günse kelimeleri seçer.
    function ensureToday() {
      const today = localDateStr();
      if (state.visits[state.visits.length - 1] !== today) {
        state.visits.push(today);
        state.visits = state.visits.slice(-400);
      }
      if (state.day && state.day.date === today) return;

      const pick = pickDay();
      if (!pick) {
        state.day = { date: today, number: state.dayCount, allDone: true };
        save(state);
        return;
      }
      const id = levelId(pick.lvl);
      if (!pick.review) state.levelIndex = pick.lvl;
      const seen = new Set(state.seen[id] || []);
      state.seen[id] = [...(state.seen[id] || []), ...pick.words.filter(en => !seen.has(en))];
      state.dayCount++;
      const oldest = shiftDate(today, -(PROGRESS_WINDOW_DAYS * 2));
      state.history = state.history.filter(h => h.date >= oldest);
      state.history.push({ date: today, lvl: pick.lvl, words: pick.words });
      state.day = {
        date: today,
        number: state.dayCount,
        lvl: pick.lvl,
        review: pick.review,
        words: pick.words,
        phase: "choice",
        mistakes: [],
        round: newRound(shuffle(pick.words)),
        fillIndex: 0,
      };
      save(state);
    }

    function dayPool() { return LEVELS[state.day.lvl].words; }
    function findDayWord(en) { return dayPool().find(w => w.en === en); }
    function inPlacement() { return !!state.placement; }

    function streakDays() {
      const visited = new Set(state.visits);
      let streak = 0;
      let date = localDateStr();
      while (visited.has(date)) { streak++; date = shiftDate(date, -1); }
      return streak;
    }

    function wordsSeenInWindow() {
      const since = shiftDate(localDateStr(), -(PROGRESS_WINDOW_DAYS - 1));
      const seen = new Set();
      state.history.filter(h => h.date >= since).forEach(h => h.words.forEach(en => seen.add(h.lvl + ":" + en)));
      return seen.size;
    }

    // Hoparlör düğmesi — cihazda İngilizce ses yoksa hiç gösterilmez.
    function speakButton(text) {
      if (Speech.status !== "yes") return null;
      const btn = el("button", "speak-btn", "🔊");
      btn.type = "button";
      btn.setAttribute("aria-label", "Sesli oku");
      btn.addEventListener("click", () => Speech.speak(text));
      return btn;
    }
    function wordRow(text) {
      const row = el("div", "word-row");
      row.append(el("div", "word", text.toUpperCase()));
      const speak = speakButton(text);
      if (speak) row.append(speak);
      return row;
    }

    function renderTop() {
      const top = el("div", "top");
      const row = el("div", "top-row");
      row.append(el("div", "greeting", "Merhaba " + state.name + " 👋"));
      if (!inPlacement()) {
        const toggle = el("button", "link-btn", view === "progress" ? "Çalışmaya dön" : "İlerleme");
        toggle.type = "button";
        toggle.addEventListener("click", () => { view = view === "progress" ? "study" : "progress"; render(); });
        row.append(toggle);
      }
      top.append(row);

      const bar = el("div", "level-bar");
      const left = el("span");
      if (inPlacement()) {
        left.append(el("strong", null, "Seviye testi"));
      } else if (state.day.allDone) {
        left.append(el("strong", null, "Tüm seviyeler tamamlandı"));
      } else {
        left.append(el("strong", null, "Gün " + state.day.number),
          " · " + levelId(state.day.lvl) + (state.day.review ? " tekrar" : "") +
          " · " + PHASE_LABELS[state.day.phase]);
      }
      bar.append(left);
      top.append(bar);

      const holder = inPlacement() ? state.placement
        : (view === "study" && ["choice", "write", "listen", "understand"].includes(state.day.phase)) ? state.day.round
        : null;
      if (holder) {
        const percent = holder.answered === 0 ? 0 : Math.round((holder.correct / holder.answered) * 100);
        const stats = el("div", "stats");
        [
          [holder.answered, "Cevaplanan", ""],
          [holder.correct, "Doğru", "correct"],
          [holder.wrong, "Yanlış", "wrong"],
          ["%" + percent, "Başarı", ""],
        ].forEach(([value, label, tone]) => {
          const box = el("div", "stat");
          box.append(el("div", "stat-value " + tone, String(value)), el("div", "stat-label", label));
          stats.append(box);
        });
        top.append(stats);
      }
      return top;
    }

    function unlockBanner() {
      if (!state.unlockNotice) return null;
      const banner = el("div", "banner");
      banner.append(el("span", null, "🎉 " + state.unlockNotice + " kilidi açıldı! Yeni günlerde " +
        state.unlockNotice + " kelimeleri gelecek."));
      const ok = el("button", "link-btn", "Tamam");
      ok.type = "button";
      ok.addEventListener("click", () => { state.unlockNotice = null; save(state); render(); });
      banner.append(ok);
      return banner;
    }

    function resetButton() {
      const btn = el("button", "reset", "İlerlemeyi sıfırla");
      btn.type = "button";
      btn.addEventListener("click", () => {
        if (!confirm("İsmin, seviye testi sonucun, serin ve tüm ilerlemen silinecek; uygulama baştan başlayacak. Emin misin?")) return;
        clearTimeout(autoNextTimer);
        clearSaved();
        state = freshState();
        view = "study";
        save(state);
        render();
      });
      return btn;
    }

    function render() {
      container.replaceChildren();
      const card = el("div", "card");

      if (!state.name) {
        renderNameCard(card);
        container.append(card);
        return;
      }

      if (inPlacement()) {
        container.append(renderTop());
        const p = state.placement;
        if (p.index >= p.deck.length && !p.lastAnswer) card.append(renderPlacementResult());
        else renderPlacementCard(card);
        container.append(card, resetButton());
        return;
      }

      ensureToday(); // gün değiştiyse (gece yarısı geçtiyse) yeni günün kelimeleri burada gelir
      const day = state.day;
      // Cihazda İngilizce ses yoksa dinleme adımı atlanır.
      if (day.phase === "listen" && Speech.status === "no") {
        day.phase = "fill";
        day.fillIndex = 0;
        save(state);
      }
      // Anlama adımı (günün son adımı) bittiyse gün tamamlanır.
      if (day.phase === "understand" && day.round.index >= day.round.deck.length && !day.round.lastAnswer) {
        day.phase = "done";
        save(state);
      }

      container.append(renderTop());
      const banner = unlockBanner();
      if (banner) container.append(banner);

      const roundOver = day.round && day.round.index >= day.round.deck.length && !day.round.lastAnswer;
      if (view === "progress") card.append(renderProgress());
      else if (day.allDone) card.append(renderAllDone());
      else if (day.phase === "done") card.append(renderDayDone());
      else if (day.phase === "fill") {
        if (day.fillIndex >= day.words.length) card.append(renderPhaseSummary());
        else renderFillCard(card);
      }
      else if (roundOver) card.append(renderPhaseSummary());
      else if (day.phase === "choice") renderChoiceCard(card);
      else if (day.phase === "write") renderWriteCard(card);
      else if (day.phase === "listen") renderListenCard(card);
      else renderUnderstandCard(card);

      container.append(card, resetButton());
    }

    function actionButton(label, action) {
      const btn = el("button", "primary", label);
      btn.type = "button";
      btn.addEventListener("click", () => { action(); save(state); render(); });
      return btn;
    }

    function renderNameCard(card) {
      const box = el("div", "summary");
      box.append(el("h2", null, "Hoş geldin!"), el("p", null, "Adın ne?"));

      const form = el("form", "write-form");
      const input = el("input", "write-input");
      input.type = "text";
      input.maxLength = NAME_MAX_LENGTH;
      input.autocomplete = "off";
      input.placeholder = "Adını yaz";
      const go = el("button", "primary", "Devam");
      go.type = "submit";
      go.style.marginTop = "0";
      form.append(input, go);

      form.addEventListener("submit", event => {
        event.preventDefault();
        const name = input.value.replace(/\s+/g, " ").trim().slice(0, NAME_MAX_LENGTH);
        if (!name) { input.focus(); return; }
        state.name = name;
        if (state.needsPlacement) state.placement = newPlacement();
        save(state);
        render();
      });

      card.append(box, form, el("div", "name-note", "İsmin yalnızca bu cihazda saklanır."));
      queueMicrotask(() => input.focus());
    }

    // Test sonucu: toplam doğru sayısına göre başlangıç seviyesi. Sonuç kaydedilir, test bir daha sorulmaz.
    function renderPlacementResult() {
      const p = state.placement;
      const startIndex = p.correct >= PLACEMENT_PASS ? 1 : 0;
      const box = el("div", "summary");
      box.append(
        el("h2", null, "Seviye testi bitti"),
        el("p", null, p.deck.length + " sorudan " + p.correct + " tanesini bildin."),
        el("p", null, LEVELS[1].id + " için en az " + PLACEMENT_PASS + " doğru gerekiyordu."),
        el("p", null, LEVELS[startIndex].id + " seviyesinden başlıyorsun."),
        actionButton("Başla", () => {
          state.placement = null;
          state.needsPlacement = false;
          state.levelIndex = startIndex;
          state.day = null;
        }),
      );
      return box;
    }

    // Bir adım bittiğinde sonraki adıma geçiş ekranı.
    function renderPhaseSummary() {
      const day = state.day;
      const r = day.round;
      const box = el("div", "summary");
      const goListen = () => { day.phase = "listen"; day.round = newRound(shuffle(day.words)); };
      const goFill = () => { day.phase = "fill"; day.fillIndex = 0; };
      const goUnderstand = () => { day.phase = "understand"; day.round = newRound(shuffle(day.words)); };
      const afterWrite = Speech.status === "no" ? goFill : goListen;

      if (day.phase === "choice") {
        box.append(el("h2", null, "Seçmeli sorular bitti"), el("p", null, "Doğru: " + r.correct + " · Yanlış: " + r.wrong));
        if (day.mistakes.length > 0) {
          box.append(
            el("p", null, "Yanlış yaptığın " + day.mistakes.length +
              " kelimeyi şimdi şıksız soracağım; Türkçe anlamını yazacaksın."),
            actionButton("Yazma adımına geç", () => {
              day.phase = "write";
              day.round = newRound(shuffle(day.mistakes));
            }),
          );
        } else {
          box.append(el("p", null, "Hepsini bildin!"),
            actionButton(afterWrite === goListen ? "Dinleme adımına geç" : "Boşluk doldurmaya geç", afterWrite));
        }
      } else if (day.phase === "write") {
        box.append(el("h2", null, "Yazma adımı bitti"),
          actionButton(afterWrite === goListen ? "Dinleme adımına geç" : "Boşluk doldurmaya geç", afterWrite));
      } else if (day.phase === "listen") {
        box.append(el("h2", null, "Dinleme bitti"), el("p", null, "Doğru: " + r.correct + " · Yanlış: " + r.wrong),
          el("p", null, "Sırada boşluk doldurma var: cümlede eksik kelimeyi yazacaksın."),
          actionButton("Boşluk doldurmaya geç", goFill));
      } else if (day.phase === "fill") {
        box.append(el("h2", null, "Boşluk doldurma bitti"),
          el("p", null, "Son adım: İngilizce cümleleri okuyup ne anlattığını seçeceksin."),
          actionButton("Anlama adımına geç", goUnderstand));
      }
      return box;
    }

    function renderDayDone() {
      const box = el("div", "summary");
      box.append(
        el("h2", null, "Gün " + state.day.number + " tamamlandı! 🎉"),
        el("p", null, "Bugünkü " + state.day.words.length + " kelimeyi bitirdin. Yarın yeni kelimeler gelecek."),
        actionButton("İlerlemeyi gör", () => { view = "progress"; }),
      );
      return box;
    }

    function renderAllDone() {
      const box = el("div", "summary");
      box.append(
        el("h2", null, "Tebrikler!"),
        el("p", null, "Mevcut tüm seviyelerin kelimelerini gördün. Yeni kelime şimdilik yok."),
      );
      return box;
    }

    function renderProgress() {
      const box = el("div", "summary");
      box.append(el("h2", null, "İlerleme"));
      const list = el("ul", "progress-list");
      const rows = [
        ["Seri", streakDays() + " gün üst üste"],
        ["Son " + PROGRESS_WINDOW_DAYS + " günde görülen kelime", String(wordsSeenInWindow())],
        ["Çalışma günü", "Gün " + state.dayCount],
      ];
      LEVELS.forEach((lvl, i) => {
        if (isUnlocked(i)) {
          rows.push([lvl.id, "✅ Açık · " + knownCount(i) + "/" + lvl.words.length + " doğru"]);
        } else {
          const prev = LEVELS.slice(0, i).map(l => l.id).join("+");
          rows.push([lvl.id, "🔒 Kilitli · " + prev + " %" + unlockPercent(i) + " / %" + UNLOCK_PERCENT]);
        }
      });
      rows.forEach(([label, value]) => {
        const li = el("li");
        li.append(el("span", null, label), el("span", "value", value));
        list.append(li);
      });
      box.append(list, actionButton("Çalışmaya dön", () => { view = "study"; }));
      return box;
    }

    // Cevaptan sonra sonuç kısa süre görünür, ardından kendiliğinden sonraki karta geçilir.
    const AUTO_NEXT_MS = { correct: 1000, wrong: 2500 };
    let autoNextTimer = null;
    function autoNext(isCorrect, onAdvance) {
      clearTimeout(autoNextTimer);
      autoNextTimer = setTimeout(() => {
        onAdvance();
        save(state);
        render();
      }, isCorrect ? AUTO_NEXT_MS.correct : AUTO_NEXT_MS.wrong);
    }

    function recordAnswer(holder, isCorrect, lastAnswer) {
      holder.answered++;
      if (isCorrect) holder.correct++; else holder.wrong++;
      holder.index++;
      holder.lastAnswer = lastAnswer;
      holder.shown = null;
      save(state);
      container.querySelector(".top").replaceWith(renderTop());
    }

    // 1 doğru + (CHOICE_COUNT-1) farklı yanlış şık; sıra rastgele.
    function optionsFor(correct, pool) {
      const wrong = shuffle([...new Set(pool)].filter(t => t !== correct)).slice(0, CHOICE_COUNT - 1);
      return shuffle([correct, ...wrong]);
    }

    // Ortak şıklı soru kartı. Gösterilen şıklar kaydedilir; sayfa yenilense de aynı şıklar gelir.
    function renderChoiceQuestion(card, { holder, key, correct, pool, renderPrompt, counterLabel, extra, onAnswered, onResult }) {
      const pending = holder.lastAnswer;
      let choices;
      if (pending) choices = pending.choices;
      else if (holder.shown && holder.shown.key === key) choices = holder.shown.choices;
      else { choices = optionsFor(correct, pool); holder.shown = { key, choices }; save(state); }

      renderPrompt(card, !!pending);

      const options = el("div", "options");
      const feedback = el("div", "feedback");
      const buttons = choices.map((text, i) => {
        const btn = el("button", "option");
        btn.type = "button";
        btn.append(el("span", "letter", OPTION_LETTERS[i] + ")"), text);
        btn.addEventListener("click", () => answer(text));
        options.append(btn);
        return { btn, text };
      });

      function showResult(picked) {
        const isCorrect = picked === correct;
        buttons.forEach(({ btn, text }) => {
          btn.disabled = true;
          if (text === correct) btn.classList.add("correct");
          else if (text === picked) btn.classList.add("wrong");
        });
        const correctLetter = OPTION_LETTERS[choices.indexOf(correct)];
        feedback.className = "feedback " + (isCorrect ? "correct" : "wrong");
        feedback.textContent = isCorrect ? "Doğru!" : "Yanlış. Doğru cevap: " + correctLetter + ") " + correct;
        if (onResult) onResult(feedback);
        autoNext(isCorrect, () => { holder.lastAnswer = null; });
      }

      function answer(picked) {
        const isCorrect = picked === correct;
        onAnswered(isCorrect);
        recordAnswer(holder, isCorrect, { ...extra, key, choices, picked });
        showResult(picked);
      }

      card.append(options, feedback);
      const shownIndex = pending ? holder.index : holder.index + 1;
      card.append(el("div", "remaining", counterLabel + " " + shownIndex + " / " + holder.deck.length));
      if (pending) showResult(pending.picked);
    }

    function currentKey(holder, deckItemToKey) {
      return holder.lastAnswer ? holder.lastAnswer.key : deckItemToKey(holder.deck[holder.index]);
    }

    function renderPlacementCard(card) {
      const p = state.placement;
      const item = p.lastAnswer ? { lvl: p.lastAnswer.lvl, en: p.lastAnswer.key } : p.deck[p.index];
      const pool = LEVELS[item.lvl].words;
      const word = pool.find(w => w.en === item.en);
      renderChoiceQuestion(card, {
        holder: p,
        key: word.en,
        correct: word.tr,
        pool: pool.map(w => w.tr),
        renderPrompt: c => c.append(wordRow(word.en)),
        counterLabel: "Soru",
        extra: { lvl: item.lvl },
        onAnswered: () => {},
      });
    }

    function renderChoiceCard(card) {
      const day = state.day;
      const word = findDayWord(currentKey(day.round, en => en));
      renderChoiceQuestion(card, {
        holder: day.round,
        key: word.en,
        correct: word.tr,
        pool: dayPool().map(w => w.tr),
        renderPrompt: c => c.append(wordRow(word.en)),
        counterLabel: "Kart",
        extra: {},
        onAnswered: ok => {
          if (ok) markKnown(day.lvl, word.en);
          else day.mistakes.push(word.en);
        },
      });
    }

    // Dinleme: kelime yazıyla gösterilmez, yalnızca sesli okunur.
    function renderListenCard(card) {
      if (Speech.status !== "yes") {
        card.append(el("p", "summary", "Ses hazırlanıyor…"));
        return;
      }
      const day = state.day;
      const word = findDayWord(currentKey(day.round, en => en));
      renderChoiceQuestion(card, {
        holder: day.round,
        key: word.en,
        correct: word.tr,
        pool: dayPool().map(w => w.tr),
        renderPrompt: (c, answered) => {
          const listen = el("button", "primary listen-btn", "🔊 Dinle");
          listen.type = "button";
          listen.addEventListener("click", () => Speech.speak(word.en));
          c.append(el("p", "question", "Duyduğun kelimenin anlamı ne?"), listen);
          if (!answered) Speech.speak(word.en);
        },
        counterLabel: "Dinleme",
        extra: {},
        onAnswered: () => {},
        onResult: feedback => feedback.after(el("div", "reveal", "Kelime: " + word.en.toUpperCase())),
      });
    }

    // Anlama: örnek cümle yazıyla gösterilir ve sesli okunur; Türkçe karşılığı seçilir.
    function renderUnderstandCard(card) {
      const day = state.day;
      const word = findDayWord(currentKey(day.round, en => en));
      renderChoiceQuestion(card, {
        holder: day.round,
        key: word.en,
        correct: word.exTr,
        pool: dayPool().map(w => w.exTr),
        renderPrompt: (c, answered) => {
          const row = el("div", "sentence-row");
          row.append(el("div", "sentence-text", word.ex));
          const speak = speakButton(word.ex);
          if (speak) row.append(speak);
          c.append(row, el("p", "question", "Bu cümle ne anlatıyor?"));
          if (!answered) Speech.speak(word.ex);
        },
        counterLabel: "Cümle",
        extra: {},
        onAnswered: () => {},
      });
    }

    function renderWriteCard(card) {
      const r = state.day.round;
      const pending = r.lastAnswer;
      const word = findDayWord(pending ? pending.key : r.deck[r.index]);

      card.append(wordRow(word.en));
      card.append(el("div", "write-hint", "Türkçe anlamını yaz"));

      const form = el("form", "write-form");
      const input = el("input", "write-input");
      input.type = "text";
      input.autocomplete = "off";
      input.setAttribute("autocapitalize", "off");
      input.spellcheck = false;
      const check = el("button", "primary", "Kontrol et");
      check.type = "submit";
      check.style.marginTop = "0";
      form.append(input, check);

      const feedback = el("div", "feedback");
      const counter = el("div", "remaining");
      const updateCounter = () => { counter.textContent = "Kalan kelime: " + (r.deck.length - r.index); };
      updateCounter();

      function showResult(typed) {
        updateCounter();
        const isCorrect = normalizeAnswer(typed) === normalizeAnswer(word.tr);
        input.value = typed;
        input.disabled = true;
        input.classList.add(isCorrect ? "correct" : "wrong");
        check.remove();
        feedback.className = "feedback " + (isCorrect ? "correct" : "wrong");
        feedback.textContent = isCorrect
          ? "Doğru! (" + word.tr + ")"
          : "Yanlış. Doğrusu: " + word.tr + " — bu kelime sonra tekrar gelecek.";
        autoNext(isCorrect, () => { r.lastAnswer = null; });
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const typed = input.value;
        if (!typed.trim()) return;
        const isCorrect = normalizeAnswer(typed) === normalizeAnswer(word.tr);
        if (!isCorrect) r.deck.push(word.en); // doğru yazılana kadar tekrar sorulur
        recordAnswer(r, isCorrect, { key: word.en, typed });
        showResult(typed);
      });

      card.append(form, feedback, counter);
      if (pending) showResult(pending.typed);
      else queueMicrotask(() => input.focus()); // kart ekrana eklendikten sonra imleç kutuya gelsin
    }

    // Boşluk doldurma: örnek cümlede kelimenin yeri boş; doğru yazılana kadar aynı cümle sorulur.
    // Cevabı söyleyeceği için bu kartta hoparlör yok.
    function renderFillCard(card) {
      const day = state.day;
      const word = findDayWord(day.words[day.fillIndex]);
      const [before, after] = splitAtWord(word.ex, word.en);

      const sentence = el("div", "fill-sentence");
      sentence.append(before, el("span", "blank", " "), after);
      card.append(sentence, el("div", "write-hint", "İpucu: " + word.tr));

      const form = el("form", "write-form");
      const input = el("input", "write-input");
      input.type = "text";
      input.autocomplete = "off";
      input.setAttribute("autocapitalize", "off");
      input.spellcheck = false;
      input.placeholder = "Boşluğa gelecek kelime";
      const check = el("button", "primary", "Kontrol et");
      check.type = "submit";
      check.style.marginTop = "0";
      form.append(input, check);

      const feedback = el("div", "feedback");

      form.addEventListener("submit", event => {
        event.preventDefault();
        if (!input.value.trim()) return;
        if (!fillAnswerIsCorrect(input.value, word.en)) {
          input.classList.add("wrong");
          feedback.className = "feedback wrong";
          feedback.textContent = "Yanlış, tekrar dene.";
          input.focus();
          return;
        }
        input.classList.remove("wrong");
        input.classList.add("correct");
        input.disabled = true;
        check.remove();
        feedback.className = "feedback correct";
        feedback.textContent = "Doğru!";
        day.fillIndex++;
        save(state);
        autoNext(true, () => {});
      });
      input.addEventListener("input", () => input.classList.remove("wrong"));

      card.append(form, feedback,
        el("div", "remaining", "Boşluk " + (day.fillIndex + 1) + " / " + day.words.length));
      queueMicrotask(() => input.focus());
    }

    // Ses durumu belli olunca (ya da değişince) ekranı yeniden çiz: hoparlörler görünür/gizlenir.
    Speech.onChange(() => render());

    render();
  },
};

/* =========================================================================
   BAŞLAT — şu an yalnızca Aşama 1 var
   ========================================================================= */
Speech.init();
Stage1.mount(document.getElementById("app"));
</script>
